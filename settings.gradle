pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        mavenLocal()
    }

    plugins {
        id "${quarkusPluginId}" version "${quarkusPluginVersion}"
    }
}

rootProject.name = 'quarkus-commerce'

include 'contracts:common-contracts'
include 'contracts:auth-contracts'
include 'contracts:product-contracts'

include 'services:auth-service'
include 'services:gateway-service'
include 'services:product-service'
