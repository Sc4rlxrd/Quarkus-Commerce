quarkus.http.port=8081
quarkus.application.name=product-service

# PostgreSQL

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${PRODUCT_DB_USER:product_user}
quarkus.datasource.password=${PRODUCT_DB_PASSWORD:product_password}
quarkus.datasource.jdbc.url=${PRODUCT_DB_URL:jdbc:postgresql://localhost:5433/product_db}

quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.log.sql=true

# RabbitMQ broker
rabbitmq-host=${RABBITMQ_HOST:localhost}
rabbitmq-port=${RABBITMQ_PORT:5672}
rabbitmq-username=${RABBITMQ_USER:commerce_user}
rabbitmq-password=${RABBITMQ_PASSWORD:commerce_password}

# Product validation requests
mp.messaging.incoming.product-validation.connector=smallrye-rabbitmq
mp.messaging.incoming.product-validation.queue.name=product.validation.queue
mp.messaging.incoming.product-validation.queue.declare=false
mp.messaging.incoming.product-validation.exchange.name=commerce.events
mp.messaging.incoming.product-validation.exchange.declare=false

# Product validation responses
mp.messaging.outgoing.product-validated.connector=smallrye-rabbitmq
mp.messaging.outgoing.product-validated.exchange.name=commerce.events
mp.messaging.outgoing.product-validated.exchange.declare=false
mp.messaging.outgoing.product-validated.default-routing-key=product.validated

%dev.quarkus.hibernate-orm.dev-ui.allow-hql=true
%dev.quarkus.log.category."com.scarlxrd.ecommerce.product".level=DEBUG
