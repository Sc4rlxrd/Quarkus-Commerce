quarkus.http.port=8080

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${AUTH_DB_USER:auth_user}
quarkus.datasource.password=${AUTH_DB_PASSWORD:auth_password}
quarkus.datasource.jdbc.url=${AUTH_DB_URL:jdbc:postgresql://localhost:5436/auth_db}

quarkus.hibernate-orm.schema-management.strategy=update

quarkus.hibernate-orm.log.sql=true
