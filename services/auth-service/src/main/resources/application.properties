quarkus.http.port=8084
quarkus.application.name=auth-service

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${AUTH_DB_USER:auth_user}
quarkus.datasource.password=${AUTH_DB_PASSWORD:auth_password}
quarkus.datasource.jdbc.url=${AUTH_DB_URL:jdbc:postgresql://localhost:5436/auth_db}
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.log.sql=true
quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}
app.admin.name=${ADMIN_NAME:Commerce Admin}
app.admin.email=${ADMIN_EMAIL:admin@localhost}
app.admin.password=${ADMIN_PASSWORD:change-me}

# JWT verification
mp.jwt.verify.publickey.location=keys/publicKey.pem
mp.jwt.verify.issuer=quarkus-commerce

# JWT signing
smallrye.jwt.sign.key.location=keys/privateKey.pem
smallrye.jwt.new-token.issuer=quarkus-commerce

# JWT expiration
app.jwt.access-token-expiration=3600
app.jwt.refresh-token-expiration=604800

# CORS
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Accept,Authorization,Content-Type
quarkus.http.cors.access-control-allow-credentials=true