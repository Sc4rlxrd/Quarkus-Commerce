quarkus.http.port=8082
quarkus.application.name=order-service

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${ORDER_DB_USER:order_user}
quarkus.datasource.password=${ORDER_DB_PASSWORD:order_password}
quarkus.datasource.jdbc.url=${ORDER_DB_URL:jdbc:postgresql://localhost:5434/order_db}

quarkus.flyway.migrate-at-start=true

quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.log.sql=true

# RabbitMQ broker
rabbitmq-host=${RABBITMQ_HOST:localhost}
rabbitmq-port=${RABBITMQ_PORT:5672}
rabbitmq-username=${RABBITMQ_USER:commerce_user}
rabbitmq-password=${RABBITMQ_PASSWORD:commerce_password}

# RabbitMQ messaging
mp.messaging.outgoing.outbox-events.connector=smallrye-rabbitmq
mp.messaging.outgoing.outbox-events.exchange.name=commerce.events
mp.messaging.outgoing.outbox-events.exchange.declare=false

%dev.quarkus.log.category."com.scarlxrd.ecommerce.order".level=DEBUG

%dev.quarkus.hibernate-orm.dev-ui.allow-hql=true
