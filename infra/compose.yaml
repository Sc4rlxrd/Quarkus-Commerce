services:
  auth-db:
    image: postgres:17-alpine
    container_name: quarkus-commerce-auth-db

    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password

    ports:
      - "5436:5432"

    volumes:
      - auth-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  auth-postgres-data:
