services:
  auth-db:
    image: postgres:17-alpine
    container_name: quarkus-commerce-auth-db

    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password

    ports:
      - "5436:5432"

    volumes:
      - auth-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: quarkus-commerce-redis

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  product-db:
    image: postgres:17-alpine
    container_name: quarkus-commerce-product-db
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: product_user
      POSTGRES_PASSWORD: product_password
    ports:
      - "5433:5432"
    volumes:
      - product-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product_user -d product_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  order-db:
    image: postgres:17-alpine
    container_name: quarkus-commerce-order-db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_password
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_user -d order_db"]
      interval: 10s
      timeout: 5s
      retries: 5


  rabbitmq:
    image: rabbitmq:4-management
    container_name: quarkus-commerce-rabbitmq

    ports:
      - "5672:5672"     # RabbitMQ
      - "15672:15672"   # Management UI
      - "15692:15692"   # Prometheus metrics

    environment:
      RABBITMQ_DEFAULT_USER: commerce_user
      RABBITMQ_DEFAULT_PASS: commerce_password

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro

    configs:
      - source: rabbitmq_config
        target: /etc/rabbitmq/rabbitmq.conf

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

configs:
  rabbitmq_config:
    content: |
      load_definitions = /etc/rabbitmq/definitions.json

volumes:
  auth-postgres-data:
  redis-data:
  product-db-data:
  rabbitmq-data:
  order-db-data: